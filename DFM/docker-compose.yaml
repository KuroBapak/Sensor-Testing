# =============================================================
# DFM — Docker Compose (Server Kurobapak / Coolify)
# Laravel 13 + Inertia React Application
#
# One immutable image, four roles: web, queue worker, Reverb, scheduler.
# The database is external (managed by Coolify), so no DB volume here.
# All variables are set in the Coolify dashboard (Environment Variables).
#
# Pin / roll back a release: set APP_IMAGE_TAG=sha-<short-commit> in Coolify
# and redeploy. Leave it unset to follow :latest.
# =============================================================

services:
  dfm-app:
    image: ghcr.io/kurobapak/sensor-testing:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - coolify
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Publish broadcasts to Reverb over the internal network. The public
      # host that browsers use is baked in at build time (VITE_REVERB_*).
      REVERB_HOST: dfm-reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      # Logs and uploads survive redeployments.
      - storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dfm-queue:
    image: ghcr.io/kurobapak/sensor-testing:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Must not run as root: root would create root-owned log files in the
    # shared storage volume that php-fpm (www-data) cannot write to.
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    stop_grace_period: 100s
    networks:
      - coolify
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      REVERB_HOST: dfm-reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - storage:/app/storage

  dfm-reverb:
    image: ghcr.io/kurobapak/sensor-testing:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: www-data
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    # Give this service its own (sub)domain in the Coolify UI, port 8080.
    expose:
      - "8080"
    networks:
      - coolify
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Run exactly one scheduler. Nothing is registered with Laravel's
  # scheduler yet (routes/console.php); it is ready for when something is.
  dfm-scheduler:
    image: ghcr.io/kurobapak/sensor-testing:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    networks:
      - coolify
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      REVERB_HOST: dfm-reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - storage:/app/storage

networks:
  coolify:
    external: true

volumes:
  storage:
