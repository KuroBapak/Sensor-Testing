[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
memory_limit = 256M
expose_php = Off
; Docker's PHP has no php.ini by default, which leaves short tags on and breaks any "<?xml" in output.
short_open_tag = Off

[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; The image is immutable, so PHP never needs to re-check files for changes.
opcache.validate_timestamps=0
opcache.save_comments=1
