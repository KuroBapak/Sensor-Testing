# TLS ends at the Coolify proxy, so this container only ever sees plain HTTP.
# Pass the original scheme on to PHP; otherwise Laravel builds http:// URLs
# (redirects, route(), asset()) and the browser blocks the redirect after
# login as mixed content. Safe because only the proxy can reach this port.
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   on;
}

server {
    listen 8000;
    server_name _;
    root /app/public;

    # nginx defaults to 1M, which silently rejects uploads/imports (HTTP 413)
    # even though php.ini allows 100M. Keep the two values in sync.
    client_max_body_size 100M;

    # "always" so error pages (404, 405, 500) and redirects carry these headers too.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Without a real file these fall through to Laravel's routes. try_files hands them to PHP directly, because the
    # error_page 404 below would keep the 404 status on the response (robots.txt would then be read as missing).
    location = /favicon.ico { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    # Vite output has a content hash in every file name, so it can be cached for a year.
    # add_header in a location replaces the server-level ones, so the security headers are repeated here.
    location /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        fastcgi_hide_header X-Powered-By;

        # Increase buffer size for Inertia.js large response headers
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
