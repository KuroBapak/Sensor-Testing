# TLS ends at the Coolify proxy, so this container only ever sees plain HTTP.
# Pass the original scheme on to PHP; otherwise Laravel builds http:// URLs
# (redirects, route(), asset()) and the browser blocks the redirect after
# login as mixed content. Safe because only the proxy can reach this port.
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   on;
}

server {
    listen 8000;
    server_name _;
    root /app/public;

    # nginx defaults to 1M, which silently rejects uploads/imports (HTTP 413)
    # even though php.ini allows 100M. Keep the two values in sync.
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        fastcgi_hide_header X-Powered-By;

        # Increase buffer size for Inertia.js large response headers
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
